# Rime schema
# encoding: utf-8

schema:
  schema_id: triple_hangul
  name: 삼한
  version: '0.0'
  author:
    - 陳林(Chén Lín) <1chen0bryan@gmail.com>
  dependencies:
    - emoji_ko

switches:
  - name: ascii_mode
    reset: 0
    states: [ "글", "A" ]
  - name: full_shape
    states: [ ．，, 。， ]
  - name: hanja
    reset: 1
    states: [ "자", "字" ]
  - name: emoji
    reset: 0
    states: [ "자", "📏" ]

engine:
  processors:
    - lua_processor@*hangul.triple_hangul*proc
    - lua_processor@*common.commit_w_space
    - lua_processor@*common.commit_n_return
    - selector
    - lua_processor@*common.trikey*proc
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - navigator
    - express_editor
  segmentors:
    - lua_segmentor@*common.trikey*seg
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - lua_translator@*hangul.triple_hangul*tran
  filters:
    - lua_filter@*common.trans_filter@hanja
    - lua_filter@*common.trans_filter@emoji

speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcba;,./ "
  initials: "zyxwvutsrqponmlkjihgfedcba;"

hanja:
  dictionary: hanja_hangul
  tran_type: table_translator
  output_source: true
  input_types: [ hangul ]
  switch: hanja

emoji:
  dictionary: emoji_ko
  tran_type: table_translator
  output_source: true
  input_types: [ hangul ]
  switch: emoji

punctuator:
  full_shape:
    __include: punctuation:/full_shape
    "\\": [ "₩", "\\" ]
    "$":  [ "$", "₩" ]
  half_shape:
    __include: punctuation:/ascii_style
    "\\": [ "₩", "\\" ]
    "$":  [ "$", "₩" ]
    "|" : [ ·, "|", ｜, "§", "¦" ]

key_binder:
  import_preset: default
  bindings:
    # disabling paging with period and comma
    - { when: has_menu, accept: period, send: period}
    - { when: has_menu, accept: comma, send: comma}
    - { when: has_menu, accept: Escape, toggle: emoji}
    - { when: has_menu, accept: Shift+Escape, toggle: hanja}

ascii_composer:
  good_old_caps_lock: true
  Shift_L: commit_code
  Shift_R: noop

editor:
  bindings:
    Shift_R: confirm

recognizer:
  import_preset: default
